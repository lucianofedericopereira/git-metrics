# Example GitHub Actions workflow
# Copy this to .github/workflows/update-stats.yml in your repository

name: Update GitHub Stats

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-stats:
    name: Generate Stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r git-metrics-to-svg/requirements.txt

      - name: Generate GitHub statistics
        run: |
          python git-metrics-to-svg/generate_stats.py \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --output assets/stats.png \
            --format png

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/stats.png
          git diff --quiet && git diff --staged --quiet || git commit -m "Update GitHub stats"
          git push
